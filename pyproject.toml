[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "factreel"
version = "0.1.0"
description = "Fact-checked faceless short videos (YouTube Shorts, TikTok, Reels) from a list of verified facts: AI script with anti-hallucination guards, voice fallback chain, karaoke subtitles and FFmpeg render."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Jorge Lamelas", email = "205297977+DeadY2J@users.noreply.github.com" }]
keywords = [
  "youtube-shorts", "tiktok", "reels", "faceless", "video-automation", "text-to-speech",
  "edge-tts", "ffmpeg", "subtitles", "llm", "fact-checking", "spanish",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Natural Language :: English",
  "Natural Language :: Spanish",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Video",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "edge-tts>=7.3.1",
  "Pillow>=10.0",
  "requests>=2.31",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
youtube = [
  "google-api-python-client>=2.100",
  "google-auth-oauthlib>=1.1",
  "google-auth>=2.23",
]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/DeadY2J/factreel"
Issues = "https://github.com/DeadY2J/factreel/issues"
Changelog = "https://github.com/DeadY2J/factreel/blob/main/CHANGELOG.md"

[project.scripts]
factreel = "factreel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/factreel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ffmpeg: needs ffmpeg and ffprobe on PATH"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B905"]
