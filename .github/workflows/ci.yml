name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: FedericoCarboni/setup-ffmpeg@v3
        id: ffmpeg
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: End-to-end preview video
        run: |
          factreel init demo --lang es
          factreel make -c demo --offline --voice dummy --no-history
