name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        uses: FedericoCarboni/setup-ffmpeg@v3
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          pytest -q -rf --tb=line 2>&1 | tee pytest.log || { grep -E "^(FAILED|E |/|.*Error)" pytest.log | head -15 | sed 's/^/::error::/'; ffmpeg -hide_banner -filters 2>/dev/null | grep -E " (ass|xfade|loudnorm) " | sed 's/^/::warning::filter /'; exit 1; }
      - name: End-to-end preview video
        run: |
          factreel init demo --lang es
          factreel make -c demo --offline --voice dummy --no-history
